<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b1829"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Finance Doctor – Financial Scorecard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0b1829;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: linear-gradient(145deg, #0b1829 0%, #122348 60%, #0d2240 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(2rem, env(safe-area-inset-top, 2rem)) max(1.25rem, env(safe-area-inset-right, 1.25rem)) max(2rem, env(safe-area-inset-bottom, 2rem)) max(1.25rem, env(safe-area-inset-left, 1.25rem));
      gap: 0;
      overflow-x: hidden;
      position: relative;
    }

    /* Background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(26,95,212,.25), transparent),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(0,168,120,.1), transparent);
      pointer-events: none;
    }

    /* Card */
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: clamp(1.75rem, 6vw, 3rem) clamp(1.5rem, 6vw, 3rem);
      width: 100%;
      max-width: 480px;
      text-align: center;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow: 0 40px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06) inset;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: #5bc8e8;
      border-radius: 12px;
      padding: .55rem 1.2rem .45rem;
      box-shadow: 0 4px 24px rgba(91,200,232,.35);
      margin-bottom: 1.75rem;
      line-height: 1;
      user-select: none;
    }
    .logo-main {
      font-weight: 700;
      font-size: clamp(.8rem, 3vw, 1rem);
      color: #fff;
      letter-spacing: .07em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .logo-estd {
      font-size: clamp(.42rem, 1.5vw, .52rem);
      color: rgba(255,255,255,.8);
      letter-spacing: .09em;
      margin-top: .18rem;
    }

    /* Headline */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 6vw, 2.1rem);
      color: #fff;
      line-height: 1.2;
      margin-bottom: .75rem;
    }
    h1 em { color: #5bc8e8; font-style: italic; }

    .tagline {
      color: rgba(139,163,196,.85);
      font-size: clamp(.82rem, 3vw, .95rem);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    /* Trust pills */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: rgba(0,168,120,.12);
      border: 1px solid rgba(0,168,120,.25);
      border-radius: 20px;
      padding: .3rem .75rem;
      font-size: clamp(.7rem, 2.5vw, .78rem);
      font-weight: 600;
      color: #00c894;
      white-space: nowrap;
    }
    .pill-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #00c894;
      flex-shrink: 0;
    }

    /* CTA Button */
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      background: linear-gradient(135deg, #1a5fd4, #1e7cff);
      color: #fff;
      padding: 0 2rem;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(.9rem, 3.5vw, 1.05rem);
      letter-spacing: .03em;
      transition: all .22s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 8px 30px rgba(26,95,212,.45);
      width: 100%;
      min-height: 56px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:active { transform: scale(.97); box-shadow: 0 4px 16px rgba(26,95,212,.3); }
    @media (hover: hover) { .cta:hover { background: linear-gradient(135deg, #1558b0, #1a6fd4); box-shadow: 0 12px 40px rgba(26,95,212,.55); } }

    .cta-icon { font-size: 1.1rem; flex-shrink: 0; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 1.25rem 0;
      color: rgba(139,163,196,.4);
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.08);
    }

    /* Feature list */
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
      margin-bottom: 1.5rem;
    }
    .feat {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      padding: .65rem .8rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }
    .feat-icon { font-size: 1.1rem; }
    .feat-label {
      font-size: clamp(.67rem, 2.2vw, .75rem);
      font-weight: 700;
      color: rgba(255,255,255,.85);
      line-height: 1.3;
    }
    .feat-sub {
      font-size: clamp(.6rem, 2vw, .68rem);
      color: rgba(139,163,196,.6);
      line-height: 1.3;
    }

    /* Footer note */
    .note {
      font-size: clamp(.68rem, 2.2vw, .78rem);
      color: rgba(139,163,196,.5);
      line-height: 1.6;
      margin-top: 1.25rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-main">FINANCE<br/>DOCTOR</span>
      <span class="logo-estd">Estd. 2002</span>
    </div>

    <h1>Your Personal<br/><em>Financial Scorecard</em></h1>
    <p class="tagline">A complete picture of your financial health — income, expenses, assets &amp; liabilities — all in one place.</p>

    <div class="pills">
      <span class="pill"><span class="pill-dot"></span>100% Offline</span>
      <span class="pill"><span class="pill-dot"></span>Data stays on device</span>
      <span class="pill"><span class="pill-dot"></span>Free forever</span>
    </div>

    <a class="cta" href="wealth_management.html">
      <span class="cta-icon">📊</span>
      Open My Scorecard
    </a>

    </div>
</body>
</html>
